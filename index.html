<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>For Rafif ♡</title><style>
@import url('https://fonts.googleapis.com/css2?family=Indie+Flower&family=Caveat:wght@500;600;700&family=Patrick+Hand&display=swap');
:root{--ink:#302b36;--pink:#f7a9bd;--cream:#faf4ef}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#ffffff;color:var(--ink);font-family:'Patrick Hand',cursive;overflow-x:hidden}main{position:relative;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;transition:background .65s}main.night{background:#1c2033;color:#fff}main.success{background:linear-gradient(145deg,#ffe6ef,#f8c6d7 55%,#f9dfe7)}.panel{text-align:center;position:relative;width:min(100%,760px);min-height:440px;display:flex;align-items:center;flex-direction:column;justify-content:center}.eyebrow{font-size:12px;letter-spacing:.23em;text-transform:uppercase;opacity:.5;margin:0 0 20px}.question{font:400 clamp(32px,6vw,56px)/1.35 'Indie Flower',cursive;margin:0 0 25px;position:relative;z-index:2}.kitty{width:225px;height:190px;margin:0 auto 22px;position:relative;z-index:2;transition:transform .4s}.kitty img{width:100%;height:100%;object-fit:contain;display:block}.actions{width:100%;height:95px;display:flex;align-items:flex-start;justify-content:center;gap:12px;position:relative;z-index:3}.btn{font-family:'Patrick Hand',cursive;cursor:pointer;border:1.5px solid #625a61;background:#fff9f5;color:#342e33;border-radius:3px;padding:12px 30px;font-size:21px;transition:font-size .3s,padding .3s,transform .3s,background .3s;box-shadow:2px 3px 0 #00000012}.btn:focus-visible{outline:3px solid #f08bac;outline-offset:4px}.yes{position:relative;z-index:4}.no{position:relative;z-index:5}.hint{font:22px 'Caveat',cursive;opacity:.65;position:relative;z-index:2;margin-top:10px}.escape-no{position:fixed;z-index:10;transition:top .25s,left .25s}.huge-yes{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:0;background:#1c2033;color:#fff;font-size:clamp(120px,35vw,550px);font-weight:500;letter-spacing:-.06em;z-index:7;box-shadow:none}.tiny-no{position:fixed;right:5%;top:7%;z-index:9;font-size:12px;padding:9px 18px}.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;bottom:-70px;animation:floatUp var(--duration) linear infinite;opacity:.6;font-size:var(--size);left:var(--left);animation-delay:var(--delay)}@keyframes floatUp{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}.result{width:min(100%,630px);margin:auto;position:relative;z-index:2;text-align:center;animation:appear .8s both}@keyframes appear{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}.result h1{font:700 clamp(44px,9vw,78px)/1 'Caveat',cursive;margin:15px 0}.result p.subtitle{font:26px 'Caveat',cursive;margin:0 0 25px}.letter{background:#fffaf7;border:1px solid #f4c8d6;border-radius:18px;padding:clamp(24px,6vw,48px);text-align:left;box-shadow:0 18px 55px #ab657b24;line-height:1.9;font-size:19px}.letter h2{font:700 38px 'Caveat',cursive;color:#bb607e;margin:0 0 12px}.letter p{margin:0 0 16px}.letter .signature{font:600 27px 'Caveat',cursive;color:#bb607e;margin:20px 0 0}.restart{margin:25px auto 0;background:transparent;border:0;color:#7f4b64;text-decoration:underline;cursor:pointer}.spark{font-size:24px}.footer{font-size:12px;opacity:.5;margin-top:18px}@media(max-width:550px){.panel{min-height:510px}.kitty{width:190px;height:165px}.letter{line-height:1.8}.question{max-width:340px}.actions{height:105px}}

.scribbles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1;opacity:1;transition:background .3s}.scribble{position:absolute;white-space:nowrap;color:#30242b;font:700 var(--fs) / 1.05 'Indie Flower',cursive;letter-spacing:-.045em;opacity:var(--op);transform:rotate(var(--rot));user-select:none;animation:scrawl .22s steps(2,end) infinite alternate}.panel{z-index:2}.question{background:#ffffffdd;border-radius:14px;padding:0 12px}.night .question{background:#1c2033dd}.night .scribble{color:#fff3f5}.night .scribbles{background:linear-gradient(145deg,#1c203300,#170b1877)}@keyframes scrawl{to{transform:translate(2px,-1px) rotate(var(--rot))}}@media(prefers-reduced-motion:reduce){.scribble{animation:none}}

.hand-lettering{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0;max-width:100%;vertical-align:middle;line-height:1.3}
.hand-lettering .glyph{height:.9em;width:auto;object-fit:contain;display:inline-block;vertical-align:middle;margin:0 .025em}
.hand-lettering .space{width:.26em}.hand-lettering .punct{font-family:'Comic Sans MS',cursive;font-weight:300;color:#766c67;font-size:.83em}
.question .hand-lettering{max-width:100%}.btn .hand-lettering{white-space:nowrap;flex-wrap:nowrap}.huge-yes .glyph{filter:brightness(0) invert(1)}

@font-face{font-family:'CK Jot';src:url('ck-jot-regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
.question,.btn{font-family:'CK Jot',cursive;font-weight:400}

html{background:#fff}main:not(.night):not(.success){background:#fff}

.panel > *{flex-shrink:0}.actions{height:auto;min-height:105px}.hint{margin:0 0 20px;padding:6px 12px;max-width:100%;z-index:11;opacity:1;background:#ffffffed;border-radius:10px}.night .hint{background:#1c2033ed}.yes:not(.huge-yes){max-width:100%}

main.success{background-color:#fce5ec;background-image:radial-gradient(#c77c9612 .7px,transparent .7px);background-size:7px 7px;color:#845367;padding:60px 24px}
.success .result{width:min(100%,620px)}
.scrap-label{font:12px 'Patrick Hand',cursive;letter-spacing:.2em;text-transform:uppercase;color:#a97989;margin:0 0 16px}
.success .result h1{font-family:'CK Jot',cursive;font-weight:400;font-size:clamp(38px,8vw,62px);margin:0 0 48px;color:#965e75}
.scrap-note{position:relative;margin:0 38px 35px;transform:rotate(-2deg);isolation:isolate}
.success .letter{position:relative;background:#fff8f9;border:1px solid #edcdd7;border-radius:2px;box-shadow:5px 7px 0 #e9bccc66,0 14px 35px #b57b8c14;min-height:230px;padding:65px 62px 65px 48px;display:flex;align-items:center;text-align:left;font-family:'CK Jot',cursive;font-size:clamp(23px,4.6vw,29px);line-height:1.55;color:#855568}
.success .letter p{margin:0}
.paper-tape{position:absolute;top:-16px;left:36%;width:110px;height:33px;background:repeating-linear-gradient(90deg,#e9b8c5b8 0 3px,#edc5d0b8 3px 6px);transform:rotate(5deg);z-index:3;box-shadow:0 1px 2px #b17e8b12}
.lily-sticker{position:absolute;z-index:2;width:155px;height:auto;right:-62px;bottom:-38px;pointer-events:none;transform-origin:50% 90%;animation:lilySway 6s ease-in-out infinite;filter:drop-shadow(1px 3px 2px #a9707d17)}
.scrap-heart{position:absolute;left:-17px;bottom:-25px;font:48px 'Caveat',cursive;color:#c67f98;transform:rotate(-13deg);animation:heartBreathe 4s ease-in-out infinite}
.success .restart{font:17px 'Caveat',cursive;color:#9d7180;text-underline-offset:5px;margin-top:14px}.success .footer{color:#a67c8a;opacity:.8;margin-top:28px}
@keyframes lilySway{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-3deg) translateY(-3px)}}
@keyframes heartBreathe{0%,100%{opacity:.5}50%{opacity:1}}
@media(max-width:480px){.scrap-note{margin-left:5px;margin-right:22px}.success .letter{padding:55px 40px 65px 26px;min-height:220px}.lily-sticker{width:115px;right:-35px;bottom:-37px}.paper-tape{left:30%;width:95px}.success .result h1{margin-bottom:40px}}
@media(prefers-reduced-motion:reduce){.lily-sticker,.scrap-heart,.success .result{animation:none}}

.yes{transition:background .3s}.escape-no{transition:none}.actions.safe-stack{flex-direction:column;align-items:center}.no.safe-no{position:relative;inset:auto;margin-top:16px}
.final-question .eyebrow,.final-question .question,.final-question .kitty{visibility:hidden}
.final-question .scribbles{background:#1c1425}
.final-question .scribble{color:#f4b7ce;line-height:1.15}
.final-question .huge-yes{background:transparent;font-size:clamp(130px,32vw,430px);padding:18vh 0 0;letter-spacing:0;text-shadow:0 3px 3px #1c1425,0 0 28px #1c1425,0 0 65px #1c1425;color:#fff4f8}
.final-question .hint{position:fixed;top:max(24px,8dvh);left:50%;transform:translateX(-50%);width:min(88vw,720px);margin:0;padding:20px 24px;background:#241828eb;color:#fff1f7;font-family:'CK Jot',cursive;font-size:clamp(22px,4.8vw,36px);line-height:1.4;z-index:12;pointer-events:none;border:1px solid #d7a1b52b;border-radius:3px;text-align:center}
@media(prefers-reduced-motion:reduce){.final-question .scribble{animation:none}}
</style></head><body><main id="main"><div class="hearts" id="hearts" hidden></div><div id="scribbles" class="scribbles" aria-hidden="true"></div><section class="panel" id="panel"><p class="eyebrow">a very important question ♡</p><h1 class="question">Rafif, will you be my girlfriend?</h1><div class="kitty"><img src="cat-transparent.png" alt="A sweet little cat holding a pink love letter surrounded by hearts"></div><p class="hint" id="hint">choose wisely, pretty girl...</p><div class="actions" id="actions"><button class="btn yes" id="yes">yes ♡</button><button class="btn no" id="no">no</button></div></section></main><script>
function setHand(el,s){el.textContent=s;el.setAttribute('aria-label',s)}
const scribbles=document.getElementById('scribbles');const main=document.getElementById('main'),panel=document.getElementById('panel'),yes=document.getElementById('yes'),no=document.getElementById('no'),hint=document.getElementById('hint'),hearts=document.getElementById('hearts');let count=0;setHand(document.querySelector('.question'),'Rafif, will you be my girlfriend?');setHand(yes,'yes');setHand(no,'no');const lines=["you clicked the wrong one baby. Try again ♡", "no? but you told me that you wanna put a baby in me", "You are really pushing this... you keep saying no like i could ever stop wanting you", "go on. press it again. i dare you. i'm not getting tired of you.", "this no button keep getting in between us and you know i wouldnt let ANYTHING come between us :)"];
const frantic=["why???", "i thought u loved me", "MOMMYYYY PLEASE", "WHAT DID I DO", "why???why???why???", "Rafif... I love you so so so so so much", "I don't think I could live without you", "I love you more than anyone in the world", "no no no no no no no no", "DON'T DO THAT", "I THOUGHT WE WERE HAVING A NICE DAY", "PLEASE", "SAY YES", "WHY WOULDNT YOU JUST SAY YES", "You know i would do anything for you Rafif ANYTHING", "do you have someone else you like?", "WHO IS THE OTHER WOMAN... OR IS IT A MAN... TELL MEE..."];
function addScribbles(){const batch=Math.min(12+count*9,90);for(let i=0;i<batch;i++){const el=document.createElement('span');el.className='scribble';el.textContent=frantic[(i*7+count*3+Math.floor(Math.random()*5))%frantic.length];el.style.cssText=`left:${Math.random()*112-6}%;top:${Math.random()*110-5}%;--fs:${12+Math.random()*(count*3+15)}px;--rot:${Math.random()*36-18}deg;--op:${Math.min(.15+count*.09+Math.random()*.25,.88)};`;scribbles.appendChild(el)}if(scribbles.children.length>420){for(let i=0;i<75;i++)scribbles.firstChild.remove()}}

function placeNo(){
 if(count<1||count>=6||!no.isConnected)return;
 const actions=document.getElementById('actions');
 actions.classList.remove('safe-stack');no.classList.remove('safe-no');
 const w=no.offsetWidth,h=no.offsetHeight,gap=18,edge=12;
 const maxX=innerWidth-w-edge,maxY=innerHeight-h-edge;
 const blocked=[yes,document.querySelector('.question'),hint,document.querySelector('.eyebrow'),document.querySelector('.kitty')].filter(Boolean).map(el=>el.getBoundingClientRect());
 const clear=(x,y)=>x>=edge&&y>=edge&&x<=maxX&&y<=maxY&&blocked.every(r=>x+w+gap<=r.left||x-gap>=r.right||y+h+gap<=r.top||y-gap>=r.bottom);
 const xs=[edge,maxX],ys=[edge,maxY],candidates=[];
 blocked.forEach(r=>{xs.push(r.left-w-gap,r.right+gap);ys.push(r.top-h-gap,r.bottom+gap)});
 for(let i=0;i<80;i++){const x=edge+Math.random()*Math.max(0,maxX-edge),y=edge+Math.random()*Math.max(0,maxY-edge);if(clear(x,y))candidates.push({x,y})}
 for(const x of xs)for(const y of ys)if(clear(x,y))candidates.push({x,y});
 if(candidates.length){const pos=candidates[Math.floor(Math.random()*candidates.length)];no.style.left=pos.x+'px';no.style.top=pos.y+'px'}
 else{no.style.left='';no.style.top='';no.classList.add('safe-no');actions.classList.add('safe-stack')}
}
window.addEventListener('resize',placeNo);
window.addEventListener('scroll',placeNo,{passive:true});
if(document.fonts)document.fonts.ready.then(placeNo);

const finalLines=["Rafif... I love you so so so so so much", "I don't think I could live without you", "I love you more than anyone in the world", "no no no no no no no no", "DON'T DO THAT", "I THOUGHT WE WERE HAVING A NICE DAY", "PLEASE", "SAY YES", "WHY WOULDNT YOU JUST SAY YES", "You know i would do anything for you Rafif ANYTHING", "do you have someone else you like?", "WHO IS THE OTHER WOMAN... OR IS IT A MAN... TELL MEE..."];

function finalScribbles(){
 scribbles.replaceChildren();
 const fragment=document.createDocumentFragment();
 for(let i=0;i<260;i++){
  const el=document.createElement('span');el.className='scribble';
  el.textContent=finalLines[Math.floor(Math.random()*finalLines.length)];
  el.style.cssText=`left:${Math.random()*115-15}%;top:${Math.random()*110-5}%;--fs:${16+Math.random()*38}px;--rot:${Math.random()*64-32}deg;--op:${.35+Math.random()*.55};animation-delay:${-Math.random()}s;`;
  fragment.appendChild(el);
 }
 scribbles.appendChild(fragment);
}

function escapeNo(){count++;addScribbles();hint.textContent=lines[Math.min(count-1,lines.length-1)];if(count>=6){main.classList.add('night','final-question');yes.classList.add('huge-yes');yes.style.fontSize='';yes.style.padding='';setHand(yes,'yes');no.remove();hint.textContent="I'm gonna ask you one last time... Rafif, will you be my girlfriend?";hint.style.visibility='visible';finalScribbles();window.scrollTo(0,0);return}const size=Math.min(1+count*.75,5);yes.style.fontSize=`${16*size}px`;yes.style.padding=`${12*size}px min(${30*size}px,20vw)`;no.classList.add('escape-no');placeNo();if(count>=5)main.classList.add('night')}
no.addEventListener('click',escapeNo);yes.addEventListener('click',()=>{main.className='success';scribbles.remove();no.remove();panel.remove();hearts.hidden=true;hearts.innerHTML=Array.from({length:27},(_,i)=>`<span class="heart" style="--left:${(i*41)%100}%;--size:${15+i%5*6}px;--duration:${6+i%5*2}s;--delay:${-i*.7}s">${i%3===0?'🌸':'♡'}</span>`).join('');const result=document.createElement('section');result.className='result';result.innerHTML=`<h1>be patient hehe</h1><div class="scrap-note"><span class="paper-tape" aria-hidden="true"></span><img class="lily-sticker" src="pink-lilies.png" alt="Watercolor pink lilies"><article class="letter"><p>not the right time yet mommy. be patient hehe... :p)</p></article><span class="scrap-heart" aria-hidden="true">♡</span></div><button class="restart" id="restart">replay our little moment ↺</button><p class="footer">made with so much love, just for you ♡</p>`;main.appendChild(result);document.getElementById('restart').addEventListener('click',()=>location.reload());window.scrollTo({top:0,behavior:'smooth'})});
</script></body></html>
